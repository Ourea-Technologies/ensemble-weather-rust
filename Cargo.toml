[package]
name = "ensemble-weather"
version = "0.1.0"
edition = "2024"
# The latest stable Rust minus two releases; CI tests this and stable.
rust-version = "1.96"
description = "Official Rust SDK for the Ourea probabilistic weather API: ensemble forecasts, probabilities and window totals computed by the server."
license = "BSD-2-Clause"
authors = ["Ourea Technologies"]
repository = "https://github.com/Ourea-Technologies/ensemble-weather-rust"
homepage = "https://oureawx.com"
documentation = "https://docs.rs/ensemble-weather"
readme = "README.md"
keywords = ["ourea", "weather", "forecast", "ensemble", "probabilistic"]
categories = ["api-bindings", "science::geo"]
include = ["/src/*.rs", "/src/models/*.rs", "/build.rs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lib]
name = "ensemble_weather"

[features]
default = []
## A synchronous client, `ensemble_weather::blocking::Client`, that runs the
## async client on its own single-threaded Tokio runtime.
blocking = ["tokio/rt"]

[dependencies]
futures-core = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false, features = ["time"] }
url = "2.5.7"

[dev-dependencies]
regex = "1.11.1"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "test-util", "net", "io-util", "sync"] }
yaml-rust2 = "0.10.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documented allows (see CONTRIBUTING.md, "Lints"):
# - module_name_repetitions: `error::ErrorCode`, `cache::CacheEntry` read better
#   at the call site than the shortened names would.
module_name_repetitions = "allow"
